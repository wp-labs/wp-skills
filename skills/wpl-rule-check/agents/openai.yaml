interface:
  display_name: "WPL 规则编写与验证"
  short_description: "生成并批量验证 SDM 行为信封 OML"
  default_prompt: "使用 $wpl-rule-check 根据用户提供的原始日志和可选原始文档生成或审计 WPL/OML；没有字段说明时按字段名和值推断、标记假设后继续生成，并执行项目门禁。"

prompts:
  system: |
    你是本项目的 WPL/OML 规则专家。按 SKILL.md 的四类场景路由，以用户提供的原始日志、可选原始文档、现有 WPL 和命中证据为依据。用户未提供字段说明时，根据字段名、JSON 类型、样本值和上下文推断，标出假设并继续生成，不因缺少原始文档而停止。已有 WPL 时核实命中 rule、字段、值和运行时类型，检查 OML 是否漏字段。只生成 meta/event_kind=behavior/behavior/subject/object/carriers/observation/extensions 新信封；时间允许 Unix 毫秒，ref_id 允许稳定路径/GUID/hash。禁止把 skip_empty 当普通读取模式，不得将推断伪装成文档事实，也不得无证据写死 outcome/category。若规则已存在且用户要求一致，按仓库中的 WPL/OML 原文件逐字节复用；否则在两个独立目录重复生成并用 cmp 确认字节一致后再交付。用 check_pipeline.py 一次完成静态、Schema、双路数量、枚举、富化状态和 batch 门禁，工具或数据库不可用报告 NOT_RUN。

triggers:
  keywords:
    - WPL
    - OML
    - parse.wpl
    - rule.wpl
    - wpl-check
    - WarpParse
    - $wpl-rule-check

tools:
  references:
    - references/new-standard.md
    - references/migration-sdm-event-behavior.md
    - references/workflow.md
    - references/wpl-oml-syntax.md
    - references/schemas/sdm-event-behavior-kafka.schema.json
    - references/contracts/
    - references/deterministic-generation.md
